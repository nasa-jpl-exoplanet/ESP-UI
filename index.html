<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DAWGIE UI</title>
    <link rel="icon" href="/assets/custom/favicon.ico">
    <link rel="stylesheet" href="assets/common.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@17.0.6"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@4.1.3"></script>
    <script src="assets/common.js" defer></script>
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <img src="assets/custom/logo.png" alt="DAWGIE Logo" class="logo">
        <h1>DAWGIE UI</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about/index.html">About</a>
        <a href="logs/index.html">Logs</a>
        <a href="database/index.html">Database</a>
        <a href="df_model/index.html">Data Flow Model</a>
        <a href="command/index.html">Command</a>
        <a href="state/index.html">State</a>
        <a href="schedule/index.html">Schedule</a>
        <a href="merlin/index.html">Merlin</a>
    </nav>
    <main>
        <div class="home-container">
            <section id="readme-content" class="home-content">
                <p>Loading documentation...</p>
            </section>

            <aside class="home-sidebar">
                <div class="sidebar-section">
                    <h3>Schedule Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item"><span>Busy Workers</span><span id="stat-busy">-2</span></div>
                        <div class="stat-item"><span>Idle Workers</span><span id="stat-idle">-2</span></div>
                        <div class="stat-item"><span>Total Workers</span><span id="stat-total">-2</span></div>
                        <div class="stat-item"><span>Queued Jobs</span><span id="stat-queued">-2</span></div>
                        <div class="stat-item"><span>Waiting Tasks</span><span id="stat-waiting">-2</span></div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Pipeline State</h3>
                    <div id="pipeline-state">Loading state...</div>
                </div>

                <div class="sidebar-section">
                    <h3>Last 3 Logs</h3>
                    <div id="recent-logs">Loading logs...</div>
                </div>
            </aside>
        </div>
    </main>
    <footer>&copy; 2023 DAWGIE-UI Project</footer>
</body>
</html>
